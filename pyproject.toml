[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "salesforce-mcp-bridge"
version = "0.1.0"
description = "Stdio MCP bridge that proxies Cursor to Salesforce Hosted MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "httpx>=0.27.0",
    "httpx2>=2.10.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
salesforce-mcp-bridge = "salesforce_mcp_bridge.server:main"
sf-mcp-login = "salesforce_mcp_bridge.auth_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/salesforce_mcp_bridge"]

[tool.hatch.build.targets.sdist]
include = [
    "src/salesforce_mcp_bridge",
    "scripts",
    "README.md",
    ".env.example",
]
